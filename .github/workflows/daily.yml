name: Daily upload

on:
  schedule:
    - cron: "30 4 * * *"   # every day at 04:30 UTC (10:00 AM IST)
  workflow_dispatch:        # allows manual run from the Actions tab

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          pip install -r requirements.txt

      - name: Make video and upload
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          VIDEO_LANG: hinglish    # hinglish, hi (Hindi) or en (English)
          SCRIPTS_FILE: scripts_hinglish.json,scripts_facts_hinglish.json   # played in this order
          NICHE: amazing facts about famous places, temples, cars and celebrities
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save progress
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "update state" || echo "no changes"
          git push
